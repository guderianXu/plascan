name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ccache \
            ninja-build \
            g++ \
            python3 \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libopencv-dev \
            libapriltag-dev \
            libgdal-dev \
            libtiff-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool \
            libgtest-dev \
            libgmock-dev \
            libopenmesh-dev \
            ocl-icd-opencl-dev \
            libomp-dev

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'
          cache: true

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-gcc-release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-release-

      - name: Initialize compiler cache
        run: |
          ccache --zero-stats
          ccache --show-config

      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DPLASCAN_ENABLE_CONDA=OFF \
            -DPLASCAN_ENABLE_VCPKG=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log; then
            tail_msg="$(tail -n 80 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake configure failed::$tail_msg"
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2 2>&1 | tee build.log; then
            filtered_msg="$(grep -Ei 'FAILED:|fatal error:|error:|undefined reference|collect2:|ld returned|ninja: build stopped|No such file' build.log | tail -n 80 || true)"
            if [ -z "$filtered_msg" ]; then
              filtered_msg="$(tail -n 60 build.log)"
            fi
            tail_msg="$(printf '%s' "$filtered_msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake build failed::$tail_msg"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure \
            --parallel 2 \
            --timeout 120 \
            -E 'TerrainDemDomTest\.TerrainPipelineGeneratesDemDomFromDirectory' 2>&1 | tee test.log; then
            filtered_msg="$(grep -Ei 'failed|failure|error|exception|segmentation|timeout|not run|[0-9]+% tests passed' test.log | tail -n 120 || true)"
            if [ -z "$filtered_msg" ]; then
              filtered_msg="$(tail -n 80 test.log)"
            fi
            tail_msg="$(printf '%s' "$filtered_msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CTest failed::$tail_msg"
            exit 1
          fi

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats
