name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            python3 \
            wget \
            unzip \
            pkg-config \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libvulkan-dev \
            libopencv-dev \
            libapriltag-dev \
            libgdal-dev \
            libtiff-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool \
            libgtest-dev \
            libgmock-dev \
            libopenmesh-dev \
            libomp-dev

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'
          cache: true

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Install CPU LibTorch
        run: |
          mkdir -p .deps
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcpu.zip -O .deps/libtorch.zip
          unzip -q .deps/libtorch.zip -d .deps

      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DPLASCAN_ENABLE_CONDA=OFF \
            -DPLASCAN_ENABLE_VCPKG=OFF \
            -DTorch_DIR="$PWD/.deps/libtorch/share/cmake/Torch" 2>&1 | tee configure.log; then
            tail_msg="$(tail -n 80 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake configure failed::$tail_msg"
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2 2>&1 | tee build.log; then
            filtered_msg="$(grep -Ei 'FAILED:|fatal error:|error:|undefined reference|collect2:|ld returned|ninja: build stopped|No such file' build.log | tail -n 80 || true)"
            if [ -z "$filtered_msg" ]; then
              filtered_msg="$(tail -n 60 build.log)"
            fi
            tail_msg="$(printf '%s' "$filtered_msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake build failed::$tail_msg"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure \
            --timeout 120 \
            -E 'TerrainDemDomTest\.TerrainPipelineGeneratesDemDomFromDirectory' 2>&1 | tee test.log; then
            filtered_msg="$(grep -Ei 'failed|failure|error|exception|segmentation|timeout|not run|[0-9]+% tests passed' test.log | tail -n 120 || true)"
            if [ -z "$filtered_msg" ]; then
              filtered_msg="$(tail -n 80 test.log)"
            fi
            tail_msg="$(printf '%s' "$filtered_msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CTest failed::$tail_msg"
            exit 1
          fi
