name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      enable_windows_cuda:
        description: 'Run the CUDA/TensorRT smoke test and Windows release packaging on a provisioned self-hosted runner'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: 'true'

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            build-essential \
            cmake \
            ccache \
            flex \
            gfortran \
            git \
            gperf \
            g++ \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglu1-mesa-dev \
            libtool \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-xinerama0-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrender-dev \
            libxtst-dev \
            mesa-vulkan-drivers \
            nasm \
            ninja-build \
            pkg-config \
            python3 \
            python3-venv \
            unzip \
            vulkan-tools \
            xvfb \
            xauth \
            '^libxcb.*-dev'

      - name: Configure pinned vcpkg
        run: |
          vcpkg_root="${RUNNER_TEMP}/plascan-vcpkg"
          git init "${vcpkg_root}"
          git -C "${vcpkg_root}" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "${vcpkg_root}" fetch --depth 1 origin 3c5d90a305ff00ca841f085a74a7ce74ee777dee
          git -C "${vcpkg_root}" checkout --detach FETCH_HEAD
          "${vcpkg_root}/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"
          echo "VCPKG_DEFAULT_BINARY_CACHE=${RUNNER_TEMP}/vcpkg-binary-cache" >> "${GITHUB_ENV}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-3c5d90a305ff00ca841f085a74a7ce74ee777dee-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-3c5d90a305ff00ca841f085a74a7ce74ee777dee-

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check numpy scipy

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-gcc-release-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-gcc-release-

      - name: Initialize compiler cache
        run: |
          ccache --zero-stats
          ccache --show-config

      - name: Verify headless vcpkg isolation
        env:
          CONDA_PREFIX: ${{ runner.temp }}/plascan-poison-conda
        run: |
          set -o pipefail
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DVCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/build/vcpkg_installed" \
            -DVCPKG_OVERLAY_PORTS="${GITHUB_WORKSPACE}/cmake/vcpkg-overlays" \
            -DBUILD_TESTS=ON \
            -DPLASCAN_BUILD_GUI=OFF \
            -DPLASCAN_BUILD_GUI_TESTS=OFF \
            -DPLASCAN_ENABLE_CUDA=OFF \
            -DPLASCAN_ENABLE_TENSORRT=OFF 2>&1 | tee headless-configure.log
          if grep -F "${CONDA_PREFIX}" headless-configure.log; then
            echo "::error title=Conda isolation failed::Disabled conda prefix leaked into CMake configuration"
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          cache_path = Path("build-headless/CMakeCache.txt")
          cache_text = cache_path.read_text(encoding="utf-8", errors="replace")
          cache = {}
          for line in cache_text.splitlines():
              if not line or line.startswith(("//", "#")) or "=" not in line:
                  continue
              key_and_type, value = line.split("=", 1)
              key = key_and_type.split(":", 1)[0]
              cache[key] = value

          poison_prefix = os.environ["CONDA_PREFIX"].replace("\\", "/")
          if poison_prefix in cache_text.replace("\\", "/"):
              raise SystemExit("Poison conda prefix appears in CMakeCache.txt")
          for removed_option in (
              "PLASCAN_ENABLE_CONDA",
              "PLASCAN_CONDA_PREFIX",
              "PLASCAN_EFFECTIVE_CONDA_PREFIX",
              "PLASCAN_ENABLE_VCPKG",
          ):
              if removed_option in cache:
                  raise SystemExit("Removed CMake option remains: " + removed_option)

          for component in ("Qt6Test_DIR", "Qt6Widgets_DIR", "Qt6ShaderTools_DIR", "Qt6GuiPrivate_DIR"):
              value = cache.get(component, "")
              if value and not value.endswith("-NOTFOUND"):
                  raise SystemExit(
                      f"Headless configure unexpectedly discovered {component}: {value}"
                  )
          PY
          cmake --build build-headless --parallel 2 --target reconstruct_pipeline_cli

      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux-dynamic \
            -DVCPKG_INSTALLED_DIR="${GITHUB_WORKSPACE}/build/vcpkg_installed" \
            -DVCPKG_OVERLAY_PORTS="${GITHUB_WORKSPACE}/cmake/vcpkg-overlays" \
            -DPLASCAN_ENABLE_CUDA=OFF \
            -DPLASCAN_ENABLE_TENSORRT=OFF \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache 2>&1 | tee configure.log; then
            tail_msg="$(tail -n 80 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake configure failed::$tail_msg"
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2 2>&1 | tee build.log; then
            filtered_msg="$(grep -Ei 'FAILED:|fatal error:|error:|undefined reference|collect2:|ld returned|ninja: build stopped|No such file' build.log | tail -n 80 || true)"
            if [ -z "$filtered_msg" ]; then
              filtered_msg="$(tail -n 60 build.log)"
            fi
            tail_msg="$(printf '%s' "$filtered_msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake build failed::$tail_msg"
            exit 1
          fi

      - name: Test
        run: |
          set -o pipefail
          if ! xvfb-run -a env QT_QPA_PLATFORM=offscreen \
            python3 scripts/env/run_tests.py --test-dir build --output-on-failure \
            --timeout 120 2>&1 | tee test.log; then
            filtered_msg="$(grep -Ei 'failed|failure|error|exception|segmentation|timeout|not run|[0-9]+% tests passed' test.log | tail -n 120 || true)"
            if [ -z "$filtered_msg" ]; then
              filtered_msg="$(tail -n 80 test.log)"
            fi
            tail_msg="$(printf '%s' "$filtered_msg" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CTest failed::$tail_msg"
            exit 1
          fi

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

  linux-package-deb:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install package build dependencies
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            autoconf-archive \
            automake \
            bison \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            flex \
            gfortran \
            git \
            gperf \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libglu1-mesa-dev \
            libtool \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-cursor-dev \
            libxcb-xinerama0-dev \
            libxext-dev \
            libxft-dev \
            libxi-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            nasm \
            ninja-build \
            patchelf \
            pkg-config \
            python3 \
            tar \
            unzip \
            zip \
            '^libxcb.*-dev'

      - name: Configure pinned vcpkg
        run: |
          vcpkg_root="${RUNNER_TEMP}/plascan-vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "${vcpkg_root}"
          git -C "${vcpkg_root}" checkout 3c5d90a305ff00ca841f085a74a7ce74ee777dee
          "${vcpkg_root}/bootstrap-vcpkg.sh" -disableMetrics
          binary_cache="${RUNNER_TEMP}/plascan-vcpkg-binary-cache"
          mkdir -p "${binary_cache}"
          echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"
          echo "VCPKG_BINARY_SOURCES=clear;files,${binary_cache},readwrite" >> "${GITHUB_ENV}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/plascan-vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-linux-package-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-overlays/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-linux-package-

      - name: Download portable release models
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p resources/models/lightglue_tensorrt
          gh release download models-v1.1.0 --repo "${GITHUB_REPOSITORY}" \
            --pattern U2Net_v1.onnx --dir resources/models --clobber
          gh release download models-v1.1.0 --repo "${GITHUB_REPOSITORY}" \
            --pattern lightglue_sift_bucket4096.onnx \
            --dir resources/models/lightglue_tensorrt --clobber

      - name: Build validated DEB
        run: cmake --workflow --preset linux-package-deb

      - name: Upload DEB and checksum
        uses: actions/upload-artifact@v4
        with:
          name: plascan-linux-deb-${{ github.ref_name }}
          path: |
            build/linux-vcpkg-package-release/packages/release/*.deb
            build/linux-vcpkg-package-release/packages/release/*.deb.sha256
          if-no-files-found: error

  windows-cuda-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.enable_windows_cuda == true
    runs-on: [self-hosted, windows, x64, cuda, tensorrt]
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download smoke-test models
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force `
            resources/models,resources/models/lightglue_tensorrt,resources/models/birefnet_dynamic | Out-Null
          gh release download models-v1.1.0 --repo $env:GITHUB_REPOSITORY `
            --pattern U2Net_v1.onnx --dir resources/models --clobber
          gh release download models-v1.1.0 --repo $env:GITHUB_REPOSITORY `
            --pattern lightglue_sift_bucket4096.onnx `
            --dir resources/models/lightglue_tensorrt --clobber
          gh release download models-v1.2.0 --repo $env:GITHUB_REPOSITORY `
            --pattern BiRefNet_dynamic_1024.onnx `
            --dir resources/models/birefnet_dynamic --clobber
          gh release download models-v1.2.0 --repo $env:GITHUB_REPOSITORY `
            --pattern BiRefNet_dynamic_1024.provenance.json `
            --dir resources/models/birefnet_dynamic --clobber

      - name: Run CUDA and TensorRT smoke tests
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { "C:\BuildTools\VC\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          $buildParameters = @{
            SourceDir = $env:GITHUB_WORKSPACE
            BuildDir = Join-Path $env:GITHUB_WORKSPACE "build\windows-vcpkg-cuda-release"
            VcpkgRoot = $vcpkgRoot
            CleanConfigure = $true
            InstallDeps = $true
            RunTests = $true
            CTestRegex = "TensorRt|U2Net|BiRefNet|SuperPoint|Feature|Match|DenseMatch|Mvs|Sfm"
            RunU2NetTensorRtDeploymentTest = $true
            RunBiRefNetTensorRtDeploymentTest = $true
          }
          if ($env:CUDA_PATH) { $buildParameters["CudaRoot"] = $env:CUDA_PATH }
          if ($env:TENSORRT_ROOT) { $buildParameters["TensorRtRoot"] = $env:TENSORRT_ROOT }
          & scripts/build_win/build_windows_cuda.ps1 @buildParameters

  windows-package-release:
    needs: windows-cuda-smoke
    if: github.event_name == 'workflow_dispatch' && inputs.enable_windows_cuda == true
    runs-on: [self-hosted, windows, x64, cuda, tensorrt]
    timeout-minutes: 480

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download complete release model set
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force `
            resources/models,resources/models/lightglue_tensorrt,resources/models/loma_r_tensorrt,resources/models/birefnet_dynamic | Out-Null
          gh release download models-v1.1.0 --repo $env:GITHUB_REPOSITORY `
            --pattern U2Net_v1.onnx --dir resources/models --clobber
          gh release download models-v1.1.0 --repo $env:GITHUB_REPOSITORY `
            --pattern lightglue_sift_bucket4096.onnx `
            --dir resources/models/lightglue_tensorrt --clobber
          gh release download models-v1.1.0 --repo $env:GITHUB_REPOSITORY `
            --pattern "loma_r_*" --dir resources/models/loma_r_tensorrt --clobber
          gh release download models-v1.2.0 --repo $env:GITHUB_REPOSITORY `
            --pattern BiRefNet_dynamic_1024.onnx `
            --dir resources/models/birefnet_dynamic --clobber
          gh release download models-v1.2.0 --repo $env:GITHUB_REPOSITORY `
            --pattern BiRefNet_dynamic_1024.provenance.json `
            --dir resources/models/birefnet_dynamic --clobber

      - name: Seed validated CUDA build tree
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_ROOT) { $env:VCPKG_ROOT } else { "C:\BuildTools\VC\vcpkg" }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          $buildParameters = @{
            SourceDir = $env:GITHUB_WORKSPACE
            BuildDir = Join-Path $env:GITHUB_WORKSPACE "build\windows-vcpkg-cuda-release"
            VcpkgRoot = $vcpkgRoot
            CleanConfigure = $true
            InstallDeps = $true
            RunTests = $true
            CTestRegex = "TensorRt|U2Net|BiRefNet|SuperPoint|Feature|Match|DenseMatch|Mvs|Sfm"
            RunU2NetTensorRtDeploymentTest = $true
            RunBiRefNetTensorRtDeploymentTest = $true
          }
          if ($env:CUDA_PATH) { $buildParameters["CudaRoot"] = $env:CUDA_PATH }
          if ($env:TENSORRT_ROOT) { $buildParameters["TensorRtRoot"] = $env:TENSORRT_ROOT }
          & scripts/build_win/build_windows_cuda.ps1 @buildParameters

      - name: Build Windows release installer
        shell: pwsh
        run: cmake --workflow --preset windows-package-release

      - name: Upload Windows installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: plascan-windows-cuda-${{ github.ref_name }}
          path: build/windows-vcpkg-cuda-release/packages/release/*
          if-no-files-found: error

  # A Linux CUDA/TensorRT gate is intentionally deferred until the repository
  # has a provisioned self-hosted runner carrying linux/x64/cuda/tensorrt labels.
