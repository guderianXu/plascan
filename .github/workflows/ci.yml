name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            g++ \
            python3 \
            python3-numpy \
            wget \
            unzip \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libqt6opengl6-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libopencv-dev \
            libgdal-dev \
            libtiff-dev \
            libzip-dev \
            zipcmp \
            zipmerge \
            ziptool \
            libgtest-dev \
            libgmock-dev \
            libomp-dev

      - name: Install CPU LibTorch
        run: |
          mkdir -p .deps
          wget -q https://download.pytorch.org/libtorch/cpu/libtorch-cxx11-abi-shared-with-deps-2.6.0%2Bcpu.zip -O .deps/libtorch.zip
          unzip -q .deps/libtorch.zip -d .deps

      - name: Configure
        run: |
          set -o pipefail
          if ! cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -DPLASCAN_ENABLE_CONDA=OFF \
            -DPLASCAN_ENABLE_VCPKG=OFF \
            -DTorch_DIR="$PWD/.deps/libtorch/share/cmake/Torch" 2>&1 | tee configure.log; then
            tail_msg="$(tail -n 80 configure.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake configure failed::$tail_msg"
            exit 1
          fi

      - name: Build
        run: |
          set -o pipefail
          if ! cmake --build build --parallel 2 2>&1 | tee build.log; then
            tail_msg="$(tail -n 120 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            echo "::error title=CMake build failed::$tail_msg"
            exit 1
          fi

      - name: Test
        run: |
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure \
            -E 'TerrainDemDomTest\.TerrainPipelineGeneratesDemDomFromDirectory'
